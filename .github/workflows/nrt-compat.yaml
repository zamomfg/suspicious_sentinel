name: "NRT compatibility"

on:
  pull_request:
    paths:
      - "IaC/**.tf"
      - "scripts/**"
      - ".github/workflows/nrt-compat.yaml"

permissions:
  contents: read

jobs:
  nrt-compat:
    name: "NRT compatibility"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: "Install dependencies"
        run: pip install "python-hcl2==4.3.5" "pytest==8.3.5"

      - name: "Test NRT detection rules"
        run: python -m pytest scripts/tests -v -p no:cacheprovider
