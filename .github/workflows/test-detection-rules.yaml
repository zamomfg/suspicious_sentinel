name: "Test detection rules"

# On pull requests that touch the Terraform detection rules, run each rule's
# KQL against the Defender XDR advanced ("threat") hunting API and post a
# comment summarising how many alerts each rule would create and how many hits
# it produces over time. This is read-only — it never deploys anything.
on:
  pull_request:
    paths:
      - "IaC/**.tf"
      - "scripts/**"
      - ".github/workflows/test-detection-rules.yaml"

permissions:
  id-token: write # OIDC login to Azure / Entra
  contents: read
  pull-requests: write # post the results comment

jobs:
  hunt:
    name: "Run hunting queries"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Az CLI login"
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: "Install dependencies"
        # Pinned: python-hcl2 >= 5 changes load() to a raw, quote-preserving
        # format; the 4.x line returns clean strings/heredocs this script expects.
        run: pip install "python-hcl2==4.3.5"

      # The deploy identity needs the ThreatHunting.Read.All Microsoft Graph
      # application permission (with admin consent) to call runHuntingQuery.
      - name: "Acquire Microsoft Graph token"
        run: |
          TOKEN=$(az account get-access-token \
            --resource https://graph.microsoft.com \
            --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "GRAPH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: "Run detection rule hunting queries"
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
          IAC_DIR: IaC
        run: |
          python scripts/test_detection_rules.py --output report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Post results comment"
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '<!-- defender-detection-test -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
